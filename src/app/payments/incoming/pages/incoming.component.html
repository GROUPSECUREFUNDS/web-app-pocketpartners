@if (dataLoaded | async) {
  <div class="title-container">
    <h1>{{ 'payments.incoming' | translate }}</h1>
  </div>
  @for (payment of payments; track payment){
    <app-card-payment
      [payment]="payment"
      [mode]="PaymentCardMode.INCOMING"
    ></app-card-payment>
  }
  @if(payments.length==0){
    <div class="no-payments">
      <mat-icon>payments</mat-icon>
      <h2>{{'incomingPayments.noPaymentsTitle' | translate}}</h2>
      <p>{{'incomingPayments.noPaymentsInfo' | translate}}</p>
    </div>
  }
} @else {
  <div class="loading-container">
    <mat-spinner></mat-spinner>
  </div>
}
