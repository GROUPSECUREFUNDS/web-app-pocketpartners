@for (payment of payments; track payment){
  <app-card-payment
    [payment]="payment"
    [mode]="PaymentCardMode.MADE"
  ></app-card-payment>
}
@if(payments.length==0){
  <div class="no-payments">
    <mat-icon>payments</mat-icon>
    <h2>No hay pagos efectuados</h2>
    <p>Tus pagos efectuados sobre algún gasto, aparecerán aquí.</p>
  </div>
}
