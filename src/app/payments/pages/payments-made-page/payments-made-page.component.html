@for (payment of payments; track payment){
  <app-card-payment
    [payment]="payment"
    [mode]="PaymentCardMode.MADE"
  ></app-card-payment>
}
@if(payments.length==0){
  <div class="no-payments">
    <mat-icon>payments</mat-icon>
    <h2>{{'outgoingPayments.made.noPaymentsTitle' | translate}}</h2>
    <p>{{'outgoingPayments.made.noPaymentsInfo' | translate}}</p>
  </div>
}
