<div class="payment-details-page">
  <div class="title-container">
    <h1>Detalle del Gasto</h1>
  </div>

  <app-expense-summary-card
    *ngIf="expense"
    [expense]="expense"
    [groupMembers]="groupMembers"
    [showDetailsButton]="false">
  </app-expense-summary-card>
  <mat-divider></mat-divider>

  <ng-container *ngIf="payments.length === 0; else paymentsList">
    <div class="no-payments">
      <mat-icon>payments</mat-icon>
      <h2>No hay pagos asociados</h2>
      <p>Los pagos asociados a este gasto aparecerán aquí.</p>
    </div>
  </ng-container>
  <ng-template #paymentsList>
    <h2>Pagos asociados</h2>
    <mat-accordion>
      <mat-expansion-panel *ngFor="let payment of payments" [disabled]="getStatusKey(payment.status) !== 'COMPLETED'">
        <mat-expansion-panel-header>
          <mat-panel-title>{{ payment.description }}</mat-panel-title>
          <mat-panel-description>Monto: {{ payment.amount | currency }}</mat-panel-description>
          <mat-panel-description>
            <button mat-raised-button
                    [ngClass]="getStatusClass(payment.status)"
                    style="margin-left: 16px; pointer-events: none;">
              {{ getStatusLabel(payment.status) }}
            </button>
          </mat-panel-description>
        </mat-expansion-panel-header>
        <mat-card class="panel-content">
          <div class="fields-container">
            <mat-form-field appearance="fill">
              <mat-label>Descripción</mat-label>
              <input matInput [ngModel]="payment.description" [disabled]="true">
            </mat-form-field>
            <mat-form-field appearance="fill">
              <mat-label>Monto</mat-label>
              <input matInput type="number" [ngModel]="payment.amount" [disabled]="true">
            </mat-form-field>
            <mat-form-field appearance="fill">
              <mat-label>Estado</mat-label>
              <input matInput [ngModel]="payment.status" [disabled]="true">
            </mat-form-field>
            <mat-form-field appearance="fill">
              <mat-label>ID Usuario</mat-label>
              <input matInput [ngModel]="payment.userId" [disabled]="true">
            </mat-form-field>
          </div>
        </mat-card>
      </mat-expansion-panel>
    </mat-accordion>
  </ng-template>
</div>
